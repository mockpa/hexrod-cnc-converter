<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cylinder body: lit from top-left -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D9AA78"/>
      <stop offset="30%"  stop-color="#B07845"/>
      <stop offset="80%"  stop-color="#7A4A20"/>
      <stop offset="100%" stop-color="#4A2800"/>
    </linearGradient>
    <!-- Left cap: lit face -->
    <linearGradient id="capLGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E0BA88"/>
      <stop offset="100%" stop-color="#8C5A2A"/>
    </linearGradient>
    <!-- Right cap: shadow face -->
    <linearGradient id="capRGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8C5A2A"/>
      <stop offset="100%" stop-color="#3A1A00"/>
    </linearGradient>
    <!-- Top sheen on body -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000070"/>
    </filter>
    <filter id="arrowGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="33" cy="59" rx="24" ry="4" fill="#00000028"/>

  <!-- Cylinder body -->
  <rect x="12" y="24" width="40" height="22"
        fill="url(#bodyGrad)" filter="url(#drop)"/>

  <!-- Cork ring texture -->
  <g stroke="#6B3E18" stroke-width="0.9" opacity="0.45">
    <line x1="20" y1="24" x2="20" y2="46"/>
    <line x1="28" y1="24" x2="28" y2="46"/>
    <line x1="36" y1="24" x2="36" y2="46"/>
    <line x1="44" y1="24" x2="44" y2="46"/>
  </g>
  <!-- Horizontal mid-line to suggest cork rings -->
  <line x1="12" y1="35" x2="52" y2="35" stroke="#6B3E18" stroke-width="0.7" opacity="0.3"/>

  <!-- Left end cap (lit) -->
  <ellipse cx="12" cy="35" rx="5.5" ry="11"
           fill="url(#capLGrad)" stroke="#5C3010" stroke-width="1.4"/>

  <!-- Right end cap (shadow) -->
  <ellipse cx="52" cy="35" rx="5.5" ry="11"
           fill="url(#capRGrad)" stroke="#5C3010" stroke-width="1.4"/>

  <!-- Body top sheen -->
  <rect x="12" y="24" width="40" height="22" fill="url(#sheen)"/>

  <!-- Top edge highlight line -->
  <line x1="12" y1="24" x2="52" y2="24"
        stroke="#E8C080" stroke-width="1" opacity="0.6"/>

  <!-- A-axis rotation arrow (above cylinder) -->
  <g filter="url(#arrowGlow)">
    <!-- Arc sweeping ~240° -->
    <path d="M 14 18 A 18 8 0 0 1 50 18"
          fill="none" stroke="#5AAEFF" stroke-width="2.2"
          stroke-linecap="round" opacity="0.95"/>
    <!-- Arrowhead at right end -->
    <polygon points="50,18 44,13 51,12" fill="#5AAEFF"/>
    <!-- Tick at left end -->
    <polygon points="14,18 20,13 13,12" fill="#5AAEFF"/>
  </g>

  <!-- Spindle axis centre dot -->
  <circle cx="32" cy="35" r="2.5" fill="#E8C080" opacity="0.7"/>
  <circle cx="32" cy="35" r="1"   fill="#ffffff"  opacity="0.5"/>
</svg>
