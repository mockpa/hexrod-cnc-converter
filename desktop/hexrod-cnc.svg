<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="hexFill" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="35%"  stop-color="#D4A830"/>
      <stop offset="75%"  stop-color="#9A6B10"/>
      <stop offset="100%" stop-color="#5C3A00"/>
    </radialGradient>
    <radialGradient id="gloss" cx="40%" cy="28%" r="52%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00000070"/>
    </filter>
  </defs>

  <!-- Shadow blob -->
  <ellipse cx="33" cy="60" rx="22" ry="4" fill="#00000030"/>

  <!-- Main hex face (pointy-top, r=26) -->
  <polygon points="32,5 54.5,18.5 54.5,45.5 32,59 9.5,45.5 9.5,18.5"
           fill="url(#hexFill)" stroke="#4A2800" stroke-width="1.8"
           filter="url(#drop)"/>

  <!-- Outer chamfer ring -->
  <polygon points="32,5 54.5,18.5 54.5,45.5 32,59 9.5,45.5 9.5,18.5"
           fill="none" stroke="#F0C840" stroke-width="0.8" opacity="0.5"
           transform="scale(0.88) translate(4.4,3.8)"/>

  <!-- Inner ring -->
  <polygon points="32,14 46,22 46,42 32,50 18,42 18,22"
           fill="none" stroke="#F5D860" stroke-width="1.1" opacity="0.6"/>

  <!-- 6 radial grain/fiber lines -->
  <g stroke="#7A4E08" stroke-width="0.9" opacity="0.45">
    <line x1="32" y1="32" x2="32"   y2="5"/>
    <line x1="32" y1="32" x2="54.5" y2="18.5"/>
    <line x1="32" y1="32" x2="54.5" y2="45.5"/>
    <line x1="32" y1="32" x2="32"   y2="59"/>
    <line x1="32" y1="32" x2="9.5"  y2="45.5"/>
    <line x1="32" y1="32" x2="9.5"  y2="18.5"/>
  </g>

  <!-- Pith center -->
  <circle cx="32" cy="32" r="6.5" fill="#5C3A00" opacity="0.85"/>
  <circle cx="32" cy="32" r="3.5" fill="#D4A830" opacity="0.7"/>
  <circle cx="32" cy="32" r="1.5" fill="#FFF0A0" opacity="0.8"/>

  <!-- Gloss highlight -->
  <polygon points="32,5 54.5,18.5 54.5,45.5 32,59 9.5,45.5 9.5,18.5"
           fill="url(#gloss)"/>
</svg>
