[EMC]
MACHINE = test
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
OPEN_FILE = ""

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[KINS]
KINEMATICS = trivkins coordinates=XZ
JOINTS = 2

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = /home/lurr/cane_mill/hexrod-cnc-converter/linuxcnc/tool.tbl

[HAL]
HALFILE = test_minimal.hal

[TRAJ]
AXES = 3
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 50
DEFAULT_ACCELERATION = 150
MAX_ACCELERATION = 500
NO_FORCE_HOMING = 1

[AXIS_X]
MIN_LIMIT = -1.0
MAX_LIMIT = 1600.0
MAX_VELOCITY = 150
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1.0
MAX_LIMIT = 1600.0
MAX_VELOCITY = 150
MAX_ACCELERATION = 500
SCALE = 40.744

[AXIS_Z]
MIN_LIMIT = -50.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 20
MAX_ACCELERATION = 150

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -50.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 20
MAX_ACCELERATION = 150
SCALE = 800
