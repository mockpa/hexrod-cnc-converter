# grip-mill LinuxCNC Configuration
# ==================================
# Mesa 7C81 (hm2_rpspi) on Raspberry Pi
# Axes: X (length), Z (cut depth/radius), A (rotary – grip & reel seat)
#
# Use for: cork grips, reel seat blanks — cylindrical, conical, polygon profiles
# G-code generator: griff_generator.py  (set GRIFFTYP as needed)
#
# A-axis: direct-drive stepper, 3200 steps/rev ÷ 360° = 8.889 steps/deg
#   WRAPPED_ROTARY = 0  →  continuous rotation (works for all GRIFFTYP modes)
#   To reverse rotation direction: negate SCALE in [JOINT_2]  (SCALE = -8.889)

[EMC]
MACHINE = grip-mill
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
OPEN_FILE = ""
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 50
DEFAULT_ANGULAR_VELOCITY = 90
MAX_ANGULAR_VELOCITY = 720

[FILTER]
PROGRAM_EXTENSION = .ngc G-Code

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[KINS]
KINEMATICS = trivkins coordinates=XZA
JOINTS = 3

[HOSTMOT2]
DRIVER = hm2_rpspi
BOARD = 7c81
CONFIG = "num_encoders=0 num_pwmgens=0 num_stepgens=4"

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = grip.hal
POSTGUI_HALFILE = postgui.hal
HALUI = halui

[TRAJ]
AXES = 3
COORDINATES = X Z A
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 50
DEFAULT_ACCELERATION = 150
MAX_ACCELERATION = 1440
NO_FORCE_HOMING = 1

# ─── X AXIS (length along grip/reel seat) ────────────────────────────────────
[AXIS_X]
MIN_LIMIT = -1.0
MAX_LIMIT = 600.0
MAX_VELOCITY = 150
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -1.0
MAX_LIMIT = 600.0
MAX_VELOCITY = 150
MAX_ACCELERATION = 500
SCALE = 40.744
STEPLEN = 2500
STEPSPACE = 2500
DIRHOLD = 5000
DIRSETUP = 5000
HOME_SEARCH_VEL = -5
HOME_LATCH_VEL = 1
HOME_SEQUENCE = 0

# ─── Z AXIS (cut depth / radius) ─────────────────────────────────────────────
[AXIS_Z]
MIN_LIMIT = -50.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 20
MAX_ACCELERATION = 150

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -50.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 20
MAX_ACCELERATION = 150
SCALE = -800
STEPLEN = 2500
STEPSPACE = 2500
DIRHOLD = 5000
DIRSETUP = 5000
HOME_SEARCH_VEL = -3
HOME_LATCH_VEL = -0.5
HOME_SEQUENCE = 1

# ─── A AXIS (rotary) ──────────────────────────────────────────────────────────
# Direct-drive: SCALE = 3200 steps/rev ÷ 360° = 8.889 steps/deg
# MAX_VELOCITY 720 deg/s = 2 rev/s = 120 rpm  (tune to taste)
# MAX_ACCELERATION 1440 deg/s²
# WRAPPED_ROTARY 0 = continuous rotation; limits ±36000° = ±100 full turns
# HOME_SEQUENCE -1 = no homing (A has no switch; zero manually before each job)
[AXIS_A]
MIN_LIMIT = -36000.0
MAX_LIMIT = 36000.0
MAX_VELOCITY = 720
MAX_ACCELERATION = 1440
WRAPPED_ROTARY = 0

[JOINT_2]
TYPE = ANGULAR
HOME = 0.0
MIN_LIMIT = -36000.0
MAX_LIMIT = 36000.0
MAX_VELOCITY = 720
MAX_ACCELERATION = 1440
SCALE = 8.889
STEPLEN = 2500
STEPSPACE = 2500
DIRHOLD = 5000
DIRSETUP = 5000
HOME_SEQUENCE = -1
